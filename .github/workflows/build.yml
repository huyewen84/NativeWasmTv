name: Build TV APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 1. 切换为该项目强制要求的 Java 8
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "8"

      # 2. 自动下载安装项目指定的 android-27 平台 SDK
      - name: Install Android 27 Platform
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-27" "build-tools;28.0.3"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      # 3. 赋予执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. 执行正式打包
      - name: Build APK with Gradle
        run: ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace

      # 5. 上传最终生成的 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Optimized-NativeWasmTv-APK
          path: app/build/outputs/apk/**/*.apk
